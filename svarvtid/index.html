<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svarvtidskalkylator</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="navigation">
        <a href="../">← Tillbaka till huvudsidan</a>
    </div>

    <h1>Svarvtidskalkylator</h1>

    <div class="calculator">
        <div class="pathGrid">
            <div class="inputGroup" style="grid-area: inputDiameter;">
                <label for="coordinateDiameter">Diameter</label>
                <input type="number" id="coordinateDiameter" step="any" placeholder="Ange diameter">
            </div>

            <div class="inputGroup" style="grid-area: inputLength;">
                <label for="coordinateLength">Längd</label>
                <input type="number" id="coordinateLength" step="any" value="0" placeholder="Ange längd" disabled>
            </div>

            <button class="coordinateButton" style="grid-area: btnClear;" onclick="clearCoordinateInputs()">⌫</button>
            <button class="coordinateButton" style="grid-area: btnNext;" onclick="addCoordinate()">+</button>

            <canvas id="pathPreview" style="grid-area: preview; background-color: #000; border-radius: 5px;" width="400" height="120"></canvas>
        </div>

        <div class="inputColumns">
            <div class="columnGroup">
                <div class="inputGroup">
                    <label for="outerDiameter">Ytterdiameter</label>
                    <input type="number" id="outerDiameter" step="any" value="230" placeholder="Ange ytterdiameter">
                </div>

                <div class="inputGroup">
                    <label for="length">Längd</label>
                    <input type="number" id="length" step="any" value="2000" placeholder="Ange längd">
                </div>

                <div class="inputGroup">
                    <label for="innerDiameter">Innerdiameter <span class="optional">(valfritt)</span></label>
                    <input type="number" id="innerDiameter" step="any" placeholder="Ange innerdiameter (valfritt)">
                </div>
            </div>

            <div class="columnGroup">
                <div class="inputGroup">
                    <label for="feedRate">Matningshastighet</label>
                    <input type="number" id="feedRate" step="any" value="0.3" placeholder="Ange matningshastighet">
                </div>

                <div class="inputGroup">
                    <label for="cutDepth">Skärdjup</label>
                    <input type="number" id="cutDepth" step="any" value="3" placeholder="Ange skärdjup">
                </div>

                <div class="inputGroup">
                    <label for="cuttingSpeed">Vc</label>
                    <input type="number" id="cuttingSpeed" step="any" value="220" placeholder="Ange skärhastighet">
                </div>
            </div>
        </div>

        <button class="calculateButton" onclick="performTurningTimeCalculation()">Beräkna</button>
        
        <div class="result" id="result">Ange värden och klicka Beräkna</div>
        
        <button class="clearButton" onclick="clearTurningCalculatorInputs()">Rensa alla</button>
    </div>

    <script>
        let coordinatesList = [
            { diameter: 150, length: 0 },
            { diameter: 150, length: 200 },
            { diameter: 201, length: 200 },
            { diameter: 201, length: 2000 }
        ];

        function updateCoordinateLengthState() {
            const outerDiameterValue = parseFloat(document.getElementById('outerDiameter').value);
            const lengthValue = parseFloat(document.getElementById('length').value);
            const coordinateLengthInput = document.getElementById('coordinateLength');
            
            if (!isNaN(outerDiameterValue) && !isNaN(lengthValue)) {
                coordinateLengthInput.disabled = false;
                drawPreviewBackground();
            } else {
                coordinateLengthInput.disabled = true;
                clearPreviewCanvas();
            }
        }

        function drawPreviewBackground() {
            const canvas = document.getElementById('pathPreview');
            const context = canvas.getContext('2d');
            const outerDiameterValue = parseFloat(document.getElementById('outerDiameter').value);
            const lengthValue = parseFloat(document.getElementById('length').value);
            
            if (isNaN(outerDiameterValue) || isNaN(lengthValue)) return;
            
            context.clearRect(0, 0, canvas.width, canvas.height);
            
            context.strokeStyle = '#333';
            context.lineWidth = 1;
            
            context.beginPath();
            context.moveTo(0, canvas.height / 2);
            context.lineTo(canvas.width, canvas.height / 2);
            context.stroke();
            
            context.beginPath();
            context.moveTo(canvas.width, 0);
            context.lineTo(canvas.width, canvas.height);
            context.stroke();
            
            if (coordinatesList.length > 0) {
                drawCuttingPasses(context, outerDiameterValue, lengthValue);
                drawCoordinatePath(context, outerDiameterValue, lengthValue);
            }
        }

        function clearPreviewCanvas() {
            const canvas = document.getElementById('pathPreview');
            const context = canvas.getContext('2d');
            context.clearRect(0, 0, canvas.width, canvas.height);
        }

        function clearCoordinateInputs() {
            document.getElementById('coordinateDiameter').value = '';
            document.getElementById('coordinateLength').value = '0';
        }

        function addCoordinate() {
            const diameterValue = parseFloat(document.getElementById('coordinateDiameter').value);
            const lengthValue = parseFloat(document.getElementById('coordinateLength').value);
            const outerDiameterValue = parseFloat(document.getElementById('outerDiameter').value);
            const maximumLengthValue = parseFloat(document.getElementById('length').value);

            if (isNaN(diameterValue) || isNaN(lengthValue) || isNaN(outerDiameterValue) || isNaN(maximumLengthValue)) {
                return;
            }

            if (diameterValue > outerDiameterValue || lengthValue > maximumLengthValue) {
                return;
            }

            coordinatesList.push({ diameter: diameterValue, length: lengthValue });
            drawPreviewBackground();
        }

        function drawCuttingPasses(context, outerDiameterValue, lengthValue) {
            const cutDepthValue = parseFloat(document.getElementById('cutDepth').value);
            if (isNaN(cutDepthValue)) return;

            const canvas = document.getElementById('pathPreview');
            const minimumDiameter = Math.min(...coordinatesList.map(coordinate => coordinate.diameter));
            let currentCutDiameter = outerDiameterValue - (cutDepthValue * 2);

            context.strokeStyle = '#00ff00';
            context.lineWidth = 1;

            while (currentCutDiameter >= minimumDiameter) {
                const yPosition = canvas.height / 2 - (currentCutDiameter / outerDiameterValue) * (canvas.height / 2);
                
                context.beginPath();
                let lineStarted = false;
                
                for (let pixelPosition = canvas.width; pixelPosition >= 0; pixelPosition--) {
                    const currentLength = lengthValue * (1 - pixelPosition / canvas.width);
                    const minimumDiameterAtLength = getMinimumDiameterAtLength(currentLength);
                    
                    if (currentCutDiameter >= minimumDiameterAtLength) {
                        if (!lineStarted) {
                            context.moveTo(pixelPosition, yPosition);
                            lineStarted = true;
                        } else {
                            context.lineTo(pixelPosition, yPosition);
                        }
                    } else if (lineStarted) {
                        break;
                    }
                }
                
                context.stroke();
                
                if (currentCutDiameter === minimumDiameter) {
                    break;
                }
                
                const remainingMaterial = currentCutDiameter - minimumDiameter;
                const nextCutDepth = Math.min(cutDepthValue * 2, remainingMaterial);
                currentCutDiameter -= nextCutDepth;
                
                if (currentCutDiameter < minimumDiameter) {
                    currentCutDiameter = minimumDiameter;
                }
            }
        }

        function getMinimumDiameterAtLength(targetLength) {
            if (coordinatesList.length < 2) return 0;

            for (let segmentIndex = 1; segmentIndex < coordinatesList.length; segmentIndex++) {
                const previousCoordinate = coordinatesList[segmentIndex - 1];
                const currentCoordinate = coordinatesList[segmentIndex];
                
                const minimumLength = Math.min(previousCoordinate.length, currentCoordinate.length);
                const maximumLength = Math.max(previousCoordinate.length, currentCoordinate.length);
                
                if (targetLength >= minimumLength && targetLength <= maximumLength) {
                    const lengthRatio = (targetLength - previousCoordinate.length) / (currentCoordinate.length - previousCoordinate.length);
                    return previousCoordinate.diameter + lengthRatio * (currentCoordinate.diameter - previousCoordinate.diameter);
                }
            }

            if (targetLength < coordinatesList[0].length) {
                return coordinatesList[0].diameter;
            }
            
            if (targetLength > coordinatesList[coordinatesList.length - 1].length) {
                return coordinatesList[coordinatesList.length - 1].diameter;
            }

            return Math.min(...coordinatesList.map(coordinate => coordinate.diameter));
        }

        function drawCoordinatePath(context, outerDiameterValue, lengthValue) {
            const canvas = document.getElementById('pathPreview');
            
            context.strokeStyle = '#ff9500';
            context.fillStyle = '#ff9500';
            context.lineWidth = 2;
            
            context.beginPath();
            coordinatesList.forEach((coordinate, index) => {
                const xPosition = canvas.width - (coordinate.length / lengthValue) * canvas.width;
                const yPosition = canvas.height / 2 - (coordinate.diameter / outerDiameterValue) * (canvas.height / 2);
                
                if (index === 0) {
                    context.moveTo(xPosition, yPosition);
                } else {
                    context.lineTo(xPosition, yPosition);
                }
            });
            context.stroke();
            
            coordinatesList.forEach((coordinate) => {
                const xPosition = canvas.width - (coordinate.length / lengthValue) * canvas.width;
                const yPosition = canvas.height / 2 - (coordinate.diameter / outerDiameterValue) * (canvas.height / 2);
                
                context.beginPath();
                context.arc(xPosition, yPosition, 3, 0, 2 * Math.PI);
                context.fill();
            });
        }

        function calculateTurningTime() {
            if (coordinatesList.length < 2) {
                return { error: 'Minst två koordinater med olika längdvärden krävs för beräkning' };
            }

            const feedRateValue = parseFloat(document.getElementById('feedRate').value);
            const cutDepthValue = parseFloat(document.getElementById('cutDepth').value);
            const cuttingSpeedValue = parseFloat(document.getElementById('cuttingSpeed').value);

            if (isNaN(feedRateValue) || isNaN(cutDepthValue) || isNaN(cuttingSpeedValue)) {
                return { error: 'Ogiltiga skärdata' };
            }

            const hasLengthVariation = coordinatesList.some((coordinate, index) => 
                index > 0 && coordinate.length !== coordinatesList[0].length
            );

            if (!hasLengthVariation) {
                return { error: 'Koordinater måste ha olika längdvärden' };
            }

            const outerDiameterValue = parseFloat(document.getElementById('outerDiameter').value);
            const lengthValue = parseFloat(document.getElementById('length').value);
            const minimumDiameter = Math.min(...coordinatesList.map(coordinate => coordinate.diameter));
            const uniquePathDiameters = [...new Set(coordinatesList.map(coordinate => coordinate.diameter))].sort((a, b) => b - a);
            
            let totalMachiningTime = 0;
            let currentCutDiameter = outerDiameterValue - (cutDepthValue * 2);
            const cuttingPassDetails = [];
            let previousCuttableLength = 0;

            while (currentCutDiameter >= minimumDiameter) {
                const revolutionsPerMinute = (cuttingSpeedValue / currentCutDiameter) * 318;
                const cuttableLength = calculateCuttableLengthForDiameter(currentCutDiameter, lengthValue);
                
                const revolutionsRequired = cuttableLength / feedRateValue;
                const passTime = revolutionsRequired / revolutionsPerMinute;

                cuttingPassDetails.push({
                    diameter: currentCutDiameter,
                    rpm: revolutionsPerMinute,
                    length: cuttableLength,
                    time: passTime,
                    operation: 'cutting'
                });

                totalMachiningTime += passTime;
                previousCuttableLength = cuttableLength;

                if (currentCutDiameter === minimumDiameter) {
                    break;
                }

                const remainingMaterial = currentCutDiameter - minimumDiameter;
                const nextCutDepth = Math.min(cutDepthValue * 2, remainingMaterial);
                let nextCutDiameter = currentCutDiameter - nextCutDepth;
                
                if (nextCutDiameter < minimumDiameter) {
                    nextCutDiameter = minimumDiameter;
                }

                const pathDiametersInRange = uniquePathDiameters.filter(pathDiameter => 
                    pathDiameter < currentCutDiameter && pathDiameter > nextCutDiameter
                );

                for (const pathDiameter of pathDiametersInRange) {
                    const coordinatesAtPathDiameter = coordinatesList.filter(coordinate => 
                        Math.abs(coordinate.diameter - pathDiameter) < 0.1
                    );

                    if (coordinatesAtPathDiameter.length >= 2) {
                        const startLength = Math.min(...coordinatesAtPathDiameter.map(coordinate => coordinate.length));
                        const endLength = Math.max(...coordinatesAtPathDiameter.map(coordinate => coordinate.length));
                        const pathCuttingLength = endLength - startLength;
                        
                        if (pathCuttingLength > 0) {
                            if (pathCuttingLength !== previousCuttableLength) {
                                cuttingPassDetails.push({
                                    diameter: pathDiameter,
                                    rpm: 0,
                                    length: 0,
                                    time: 0,
                                    operation: 'traversal'
                                });
                            }

                            const pathRevolutionsPerMinute = (cuttingSpeedValue / pathDiameter) * 318;
                            const pathRevolutionsRequired = pathCuttingLength / feedRateValue;
                            const pathCuttingTime = pathRevolutionsRequired / pathRevolutionsPerMinute;

                            cuttingPassDetails.push({
                                diameter: pathDiameter,
                                rpm: pathRevolutionsPerMinute,
                                length: pathCuttingLength,
                                time: pathCuttingTime,
                                operation: 'cutting'
                            });

                            totalMachiningTime += pathCuttingTime;
                            previousCuttableLength = pathCuttingLength;
                        }
                    }
                }

                currentCutDiameter = nextCutDiameter;
            }

            return { 
                time: totalMachiningTime,
                cuttingPasses: cuttingPassDetails
            };
        }

        function calculateCuttableLengthForDiameter(cuttingDiameter, maximumLength) {
            let cuttableLength = 0;
            
            for (let currentLength = 0; currentLength <= maximumLength; currentLength += 0.1) {
                const minimumDiameterAtPosition = getMinimumDiameterAtLength(currentLength);
                
                if (cuttingDiameter >= minimumDiameterAtPosition) {
                    cuttableLength = currentLength;
                } else {
                    break;
                }
            }
            
            return cuttableLength;
        }

        function calculateTraversalTime(traversalDistance, feedRateValue, revolutionsPerMinute) {
            const traversalFeedRate = feedRateValue * 3;
            const revolutionsRequired = traversalDistance / traversalFeedRate;
            return revolutionsRequired / revolutionsPerMinute;
        }

        function performTurningTimeCalculation() {
            const outerDiameterValue = parseFloat(document.getElementById('outerDiameter').value);
            const innerDiameterValue = parseFloat(document.getElementById('innerDiameter').value) || 0;
            const lengthValue = parseFloat(document.getElementById('length').value);
            const feedRateValue = parseFloat(document.getElementById('feedRate').value);
            const cutDepthValue = parseFloat(document.getElementById('cutDepth').value);
            const cuttingSpeedValue = parseFloat(document.getElementById('cuttingSpeed').value);
            
            const resultElement = document.getElementById('result');
            
            if (isNaN(outerDiameterValue) || isNaN(lengthValue) || isNaN(feedRateValue) || isNaN(cutDepthValue) || isNaN(cuttingSpeedValue)) {
                resultElement.textContent = 'Vänligen ange giltiga värden för obligatoriska fält';
                resultElement.className = 'result error';
                return;
            }

            const turningTimeResult = calculateTurningTime();

            if (turningTimeResult.error) {
                resultElement.textContent = turningTimeResult.error;
                resultElement.className = 'result error';
                return;
            }

            const totalTimeInMinutes = turningTimeResult.time;
            const totalTimeInSeconds = totalTimeInMinutes * 60;

            let tableHtml = `
                <table style="width: 100%; border-collapse: collapse; color: white; margin-bottom: 10px;">
                    <thead>
                        <tr style="border-bottom: 1px solid #ff9500;">
                            <th style="text-align: left; padding: 5px;">Diameter</th>
                            <th style="text-align: left; padding: 5px;">RPM</th>
                            <th style="text-align: left; padding: 5px;">Längd</th>
                            <th style="text-align: right; padding: 5px;">Tid</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            turningTimeResult.cuttingPasses.forEach((cuttingPass) => {
                const passTimeInSeconds = cuttingPass.time * 60;
                
                if (cuttingPass.operation === 'cutting') {
                    tableHtml += `
                        <tr style="border-bottom: 1px solid #333;">
                            <td style="padding: 3px;">${cuttingPass.diameter.toFixed(1)} mm</td>
                            <td style="padding: 3px;">${cuttingPass.rpm.toFixed(0)}</td>
                            <td style="padding: 3px;">${cuttingPass.length.toFixed(1)} mm</td>
                            <td style="text-align: right; padding: 3px;">${passTimeInSeconds.toFixed(1)} s</td>
                        </tr>
                    `;
                } else if (cuttingPass.operation === 'traversal') {
                    tableHtml += `
                        <tr style="border-bottom: 1px solid #333; color: #888;">
                            <td style="padding: 3px;">↕ Förflyttning</td>
                            <td style="padding: 3px;">-</td>
                            <td style="padding: 3px;">-</td>
                            <td style="text-align: right; padding: 3px;">${passTimeInSeconds.toFixed(1)} s</td>
                        </tr>
                    `;
                }
            });

            tableHtml += `
                    </tbody>
                </table>
                <div style="text-align: right; font-weight: bold; color: #ff9500;">
                    Total: ${totalTimeInSeconds.toFixed(1)} s (${totalTimeInMinutes.toFixed(3)} min)
                </div>
            `;

            resultElement.innerHTML = tableHtml;
            resultElement.className = 'result';
        }

        function clearTurningCalculatorInputs() {
            document.getElementById('outerDiameter').value = '';
            document.getElementById('innerDiameter').value = '';
            document.getElementById('length').value = '';
            document.getElementById('feedRate').value = '0.3';
            document.getElementById('cutDepth').value = '3';
            document.getElementById('cuttingSpeed').value = '220';
            document.getElementById('coordinateDiameter').value = '';
            document.getElementById('coordinateLength').value = '0';
            coordinatesList = [];
            clearPreviewCanvas();
            updateCoordinateLengthState();
            document.getElementById('result').textContent = 'Ange värden och klicka Beräkna';
            document.getElementById('result').className = 'result';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const outerDiameterInput = document.getElementById('outerDiameter');
            const lengthInput = document.getElementById('length');
            
            outerDiameterInput.addEventListener('input', updateCoordinateLengthState);
            lengthInput.addEventListener('input', updateCoordinateLengthState);
            
            updateCoordinateLengthState();
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                performTurningTimeCalculation();
            } else if (event.key === 'Escape') {
                event.preventDefault();
                clearTurningCalculatorInputs();
            }
        });
    </script>
</body>
</html>
