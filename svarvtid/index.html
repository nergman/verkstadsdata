<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svarvtidskalkylator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navigation">
        <a href="../">← Tillbaka till huvudsidan</a>
    </div>

    <h1>Svarvtidskalkylator</h1>

    <div class="turning-time">
        <div class="turning-time__coordinate-controls">
            <div class="coordinate-input-row">
                <div class="input-group">
                    <label for="coordinateDiameter">Diameter</label>
                    <input type="text" id="coordinateDiameter" placeholder="Ange diameter">
                </div>

                <div class="input-group">
                    <label for="coordinateLength">Längd</label>
                    <input type="text" id="coordinateLength" value="0" placeholder="Ange längd">
                </div>

                <button class="coordinate-input-row__undo-button" onclick="undoLastCoordinate()">↶</button>
                <button class="coordinate-input-row__clear-button" onclick="clearCoordinatePath()">×</button>
                <button class="coordinate-input-row__add-button" onclick="addCoordinate()">+</button>
            </div>
        </div>

        <div class="turning-time__preview">
            <canvas id="pathPreview" width="600" height="120"></canvas>
        </div>

        <div class="turning-time__parameters-and-cutting-controls">
            <div class="turning-time__main-parameters-row">
                <div class="input-group">
                    <label for="outerDiameter">Ytterdia</label>
                    <input type="number" id="outerDiameter" step="any" value="230" placeholder="Ange ytterdiameter">
                </div>

                <div class="input-group">
                    <label for="length">Längd</label>
                    <input type="number" id="length" step="any" value="2000" placeholder="Ange längd">
                </div>

                <div class="input-group">
                    <label for="innerDiameter">Innerdia</label>
                    <input type="number" id="innerDiameter" step="any" placeholder="Ange innerdiameter (valfritt)">
                </div>

                <div class="input-group">
                    <label for="maximumRotationsPerMinute">RPM MAX</label>
                    <input type="number" id="maximumRotationsPerMinute" step="any" value="1000" placeholder="Ange max RPM">
                </div>
            </div>

            <div class="turning-time__rough-cut-controls cutting-controls-row">
                <div class="switch-container">
                    <div class="switch-group">
                        <div class="switch-group-label">Grov</div>
                        <label class="switch">
                            <input type="checkbox" id="enableRoughCutting" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="input-group" id="roughFeedRateGroup">
                    <label for="feedRate">Matning</label>
                    <input type="number" id="feedRate" step="any" value="0.3" placeholder="Ange matningshastighet">
                </div>

                <div class="input-group" id="roughCutDepthGroup">
                    <label for="cutDepth">Skärdjup</label>
                    <input type="number" id="cutDepth" step="any" value="3" placeholder="Ange skärdjup">
                </div>

                <div class="input-group" id="roughCuttingSpeedGroup">
                    <label for="cuttingSpeed">Vc</label>
                    <input type="number" id="cuttingSpeed" step="any" value="220" placeholder="Ange skärhastighet">
                </div>
            </div>

            <div class="turning-time__fine-cut-controls cutting-controls-row">
                <div class="switch-container">
                    <div class="switch-group">
                        <div class="switch-group-label">Fin</div>
                        <label class="switch">
                            <input type="checkbox" id="enableFineCutting">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="input-group" id="fineFeedRateGroup">
                    <label for="fineFeedRate">Matning</label>
                    <input type="number" id="fineFeedRate" step="any" value="0.18" placeholder="Ange matningshastighet">
                </div>

                <div class="input-group" id="fineCutDepthGroup">
                    <label for="fineCutDepth">Skärdjup</label>
                    <input type="number" id="fineCutDepth" step="any" value="1.0" placeholder="Ange skärdjup">
                </div>

                <div class="input-group" id="fineCuttingSpeedGroup">
                    <label for="fineCuttingSpeed">Vc</label>
                    <input type="number" id="fineCuttingSpeed" step="any" value="280" placeholder="Ange skärhastighet">
                </div>
            </div>
        </div>

        <div class="turning-time__results">
            <div id="result" class="result">Ange värden och klicka Beräkna</div>
        </div>

        <div class="turning-time__calculate-button">
            <button class="turning-time__calculate-button-element" onclick="performTurningTimeCalculation()">Beräkna</button>
        </div>
    </div>

    <script>
        let coordinatesList = [];

        function updateCoordinateLengthState() {
            const outerDiameterValue = parseFloat(document.getElementById('outerDiameter').value);
            const lengthValue = parseFloat(document.getElementById('length').value);
            const coordinateLengthInput = document.getElementById('coordinateLength');
            
            if (!isNaN(outerDiameterValue) && !isNaN(lengthValue)) {
                coordinateLengthInput.disabled = false;
                drawPreviewBackground();
            } else {
                coordinateLengthInput.disabled = true;
                clearPreviewCanvas();
            }
        }

        function handleInnerDiameterChange() {
            const innerDiameterValue = parseFloat(document.getElementById('innerDiameter').value) || 0;
            const previousInnerDiameter = parseFloat(document.getElementById('innerDiameter').dataset.previousValue) || 0;
            const previousCuttingMode = previousInnerDiameter > 0;
            const currentCuttingMode = innerDiameterValue > 0;
            
            if (window.clearPathTimeout) {
                clearTimeout(window.clearPathTimeout);
                window.clearPathTimeout = null;
            }
            
            if (previousCuttingMode !== currentCuttingMode && coordinatesList.length > 0) {
                if (currentCuttingMode) {
                    coordinatesList = [];
                    document.getElementById('coordinateDiameter').value = '';
                    document.getElementById('coordinateLength').value = '0';
                    
                    const resultElement = document.getElementById('result');
                    resultElement.textContent = 'Ange värden och klicka Beräkna';
                    resultElement.className = 'result';
                    
                    drawPreviewBackground();
                } else {
                    window.clearPathTimeout = setTimeout(() => {
                        const finalInnerDiameterValue = parseFloat(document.getElementById('innerDiameter').value) || 0;
                        const finalCuttingMode = finalInnerDiameterValue > 0;
                        
                        if (previousCuttingMode !== finalCuttingMode) {
                            coordinatesList = [];
                            document.getElementById('coordinateDiameter').value = '';
                            document.getElementById('coordinateLength').value = '0';
                            
                            const resultElement = document.getElementById('result');
                            resultElement.textContent = 'Ange värden och klicka Beräkna';
                            resultElement.className = 'result';
                            
                            drawPreviewBackground();
                        }
                        
                        window.clearPathTimeout = null;
                    }, 2000);
                }
            }
            
            document.getElementById('innerDiameter').dataset.previousValue = innerDiameterValue.toString();
            drawPreviewBackground();
        }

        function drawPreviewBackground() {
            const canvas = document.getElementById('pathPreview');
            const context = canvas.getContext('2d');
            const outerDiameterValue = parseFloat(document.getElementById('outerDiameter').value);
            const innerDiameterValue = parseFloat(document.getElementById('innerDiameter').value);
            const lengthValue = parseFloat(document.getElementById('length').value);
            const undoButton = document.querySelector('.coordinate-input-row__undo-button');
            
            if (undoButton) {
                undoButton.disabled = coordinatesList.length === 0;
            }
            
            if (isNaN(outerDiameterValue) || isNaN(lengthValue)) return;
            
            context.clearRect(0, 0, canvas.width, canvas.height);
            
            context.strokeStyle = '#333';
            context.lineWidth = 1;
            
            context.beginPath();
            context.moveTo(0, canvas.height);
            context.lineTo(canvas.width, canvas.height);
            context.stroke();
            
            context.beginPath();
            context.moveTo(canvas.width, 0);
            context.lineTo(canvas.width, canvas.height);
            context.stroke();
            
            if (!isNaN(innerDiameterValue) && innerDiameterValue > 0) {
                const innerDiameterYPosition = canvas.height - (innerDiameterValue / outerDiameterValue) * canvas.height;
                
                context.strokeStyle = '#ffffff';
                context.lineWidth = 1;
                context.setLineDash([5, 3]);
                
                context.beginPath();
                context.moveTo(0, innerDiameterYPosition);
                context.lineTo(canvas.width, innerDiameterYPosition);
                context.stroke();
                
                context.setLineDash([]);
            }
            
            if (coordinatesList.length > 0) {
                drawCuttingPasses(context, outerDiameterValue, lengthValue);
                drawCoordinatePath(context, outerDiameterValue, lengthValue);
            }
        }

        function drawCuttingPasses(context, outerDiameterValue, lengthValue) {
            const cutDepthValue = parseFloat(document.getElementById('cutDepth').value);
            const innerDiameterValue = parseFloat(document.getElementById('innerDiameter').value) || 0;
            const isInternalCutting = innerDiameterValue > 0;
            
            if (isNaN(cutDepthValue)) return;

            const canvas = document.getElementById('pathPreview');
            let currentCutDiameter;
            let targetDiameter;

            if (isInternalCutting) {
                const maximumDiameter = Math.max(...coordinatesList.map(coordinate => coordinate.diameter));
                currentCutDiameter = innerDiameterValue + (cutDepthValue * 2);
                targetDiameter = maximumDiameter;
            } else {
                const minimumDiameter = Math.min(...coordinatesList.map(coordinate => coordinate.diameter));
                currentCutDiameter = outerDiameterValue - (cutDepthValue * 2);
                targetDiameter = minimumDiameter;
            }

            context.strokeStyle = '#00ff00';
            context.lineWidth = 1;

            while (isInternalCutting ? currentCutDiameter <= targetDiameter : currentCutDiameter >= targetDiameter) {
                const yPosition = canvas.height - (currentCutDiameter / outerDiameterValue) * canvas.height;
                
                context.beginPath();
                let lineStarted = false;
                
                for (let pixelPosition = canvas.width; pixelPosition >= 0; pixelPosition--) {
                    const currentLength = lengthValue * (1 - pixelPosition / canvas.width);
                    const boundaryDiameterAtLength = isInternalCutting ? 
                        getMaximumDiameterAtLength(currentLength) : 
                        getMinimumDiameterAtLength(currentLength);
                    
                    const canCut = isInternalCutting ? 
                        currentCutDiameter <= boundaryDiameterAtLength : 
                        currentCutDiameter >= boundaryDiameterAtLength;
                    
                    if (canCut) {
                        if (!lineStarted) {
                            context.moveTo(pixelPosition, yPosition);
                            lineStarted = true;
                        } else {
                            context.lineTo(pixelPosition, yPosition);
                        }
                    } else if (lineStarted) {
                        break;
                    }
                }
                
                context.stroke();
                
                if (currentCutDiameter === targetDiameter) {
                    break;
                }
                
                if (isInternalCutting) {
                    const remainingMaterial = targetDiameter - currentCutDiameter;
                    const nextCutDepth = Math.min(cutDepthValue * 2, remainingMaterial);
                    currentCutDiameter += nextCutDepth;
                    
                    if (currentCutDiameter > targetDiameter) {
                        currentCutDiameter = targetDiameter;
                    }
                } else {
                    const remainingMaterial = currentCutDiameter - targetDiameter;
                    const nextCutDepth = Math.min(cutDepthValue * 2, remainingMaterial);
                    currentCutDiameter -= nextCutDepth;
                    
                    if (currentCutDiameter < targetDiameter) {
                        currentCutDiameter = targetDiameter;
                    }
                }
            }
        }

        function drawCoordinatePath(context, outerDiameterValue, lengthValue) {
            const canvas = document.getElementById('pathPreview');
            
            context.strokeStyle = '#ff9500';
            context.fillStyle = '#ff9500';
            context.lineWidth = 2;
            
            context.beginPath();
            coordinatesList.forEach((coordinate, index) => {
                const xPosition = canvas.width - (coordinate.length / lengthValue) * canvas.width;
                const yPosition = canvas.height - (coordinate.diameter / outerDiameterValue) * canvas.height;
                
                if (index === 0) {
                    context.moveTo(xPosition, yPosition);
                } else {
                    context.lineTo(xPosition, yPosition);
                }
            });
            context.stroke();
            
            coordinatesList.forEach((coordinate) => {
                const xPosition = canvas.width - (coordinate.length / lengthValue) * canvas.width;
                const yPosition = canvas.height - (coordinate.diameter / outerDiameterValue) * canvas.height;
                
                context.beginPath();
                context.arc(xPosition, yPosition, 3, 0, 2 * Math.PI);
                context.fill();
            });
        }

        function updateRoughCuttingInputVisibility() {
            const roughCuttingEnabled = document.getElementById('enableRoughCutting').checked;
            const roughFeedRateGroup = document.getElementById('roughFeedRateGroup');
            const roughCutDepthGroup = document.getElementById('roughCutDepthGroup');
            const roughCuttingSpeedGroup = document.getElementById('roughCuttingSpeedGroup');
            
            roughFeedRateGroup.style.display = roughCuttingEnabled ? 'block' : 'none';
            roughCutDepthGroup.style.display = roughCuttingEnabled ? 'block' : 'none';
            roughCuttingSpeedGroup.style.display = roughCuttingEnabled ? 'block' : 'none';
        }

        function updateFineCuttingInputVisibility() {
            const fineCuttingEnabled = document.getElementById('enableFineCutting').checked;
            const fineFeedRateGroup = document.getElementById('fineFeedRateGroup');
            const fineCutDepthGroup = document.getElementById('fineCutDepthGroup');
            const fineCuttingSpeedGroup = document.getElementById('fineCuttingSpeedGroup');
            
            fineFeedRateGroup.style.display = fineCuttingEnabled ? 'block' : 'none';
            fineCutDepthGroup.style.display = fineCuttingEnabled ? 'block' : 'none';
            fineCuttingSpeedGroup.style.display = fineCuttingEnabled ? 'block' : 'none';
        }

        function getAdjustedCoordinatesForRoughCutting() {
            const fineCuttingEnabled = document.getElementById('enableFineCutting').checked;
            
            if (!fineCuttingEnabled) {
                return coordinatesList;
            }
            
            const fineCutDepthValue = parseFloat(document.getElementById('fineCutDepth').value);
            if (isNaN(fineCutDepthValue)) {
                return coordinatesList;
            }
            
            return coordinatesList.map(coordinate => ({
                diameter: coordinate.diameter + (fineCutDepthValue * 2),
                length: coordinate.length
            }));
        }

        function getMinimumDiameterAtLength(targetLength) {
            if (coordinatesList.length < 2) return 0;

            for (let segmentIndex = 1; segmentIndex < coordinatesList.length; segmentIndex++) {
                const previousCoordinate = coordinatesList[segmentIndex - 1];
                const currentCoordinate = coordinatesList[segmentIndex];
                
                const minimumLength = Math.min(previousCoordinate.length, currentCoordinate.length);
                const maximumLength = Math.max(previousCoordinate.length, currentCoordinate.length);
                
                if (targetLength >= minimumLength && targetLength <= maximumLength) {
                    const lengthRatio = (targetLength - previousCoordinate.length) / (currentCoordinate.length - previousCoordinate.length);
                    return previousCoordinate.diameter + lengthRatio * (currentCoordinate.diameter - previousCoordinate.diameter);
                }
            }

            if (targetLength < coordinatesList[0].length) {
                return coordinatesList[0].diameter;
            }
            
            if (targetLength > coordinatesList[coordinatesList.length - 1].length) {
                return coordinatesList[coordinatesList.length - 1].diameter;
            }

            return Math.min(...coordinatesList.map(coordinate => coordinate.diameter));
        }

        function getMaximumDiameterAtLength(targetLength) {
            if (coordinatesList.length < 2) return 0;

            for (let segmentIndex = 1; segmentIndex < coordinatesList.length; segmentIndex++) {
                const previousCoordinate = coordinatesList[segmentIndex - 1];
                const currentCoordinate = coordinatesList[segmentIndex];
                
                const minimumLength = Math.min(previousCoordinate.length, currentCoordinate.length);
                const maximumLength = Math.max(previousCoordinate.length, currentCoordinate.length);
                
                if (targetLength >= minimumLength && targetLength <= maximumLength) {
                    const lengthRatio = (targetLength - previousCoordinate.length) / (currentCoordinate.length - previousCoordinate.length);
                    return previousCoordinate.diameter + lengthRatio * (currentCoordinate.diameter - previousCoordinate.diameter);
                }
            }

            if (targetLength < coordinatesList[0].length) {
                return coordinatesList[0].diameter;
            }
            
            if (targetLength > coordinatesList[coordinatesList.length - 1].length) {
                return coordinatesList[coordinatesList.length - 1].diameter;
            }

            return Math.max(...coordinatesList.map(coordinate => coordinate.diameter));
        }

        function getMaximumDiameterAtLengthForCuttingType(targetLength, useRoughCuttingPath = false) {
            const coordinatesToUse = useRoughCuttingPath ? getAdjustedCoordinatesForRoughCutting() : coordinatesList;
            
            if (coordinatesToUse.length < 2) return 0;

            for (let segmentIndex = 1; segmentIndex < coordinatesToUse.length; segmentIndex++) {
                const previousCoordinate = coordinatesToUse[segmentIndex - 1];
                const currentCoordinate = coordinatesToUse[segmentIndex];
                
                const minimumLength = Math.min(previousCoordinate.length, currentCoordinate.length);
                const maximumLength = Math.max(previousCoordinate.length, currentCoordinate.length);
                
                if (targetLength >= minimumLength && targetLength <= maximumLength) {
                    const lengthRatio = (targetLength - previousCoordinate.length) / (currentCoordinate.length - previousCoordinate.length);
                    return previousCoordinate.diameter + lengthRatio * (currentCoordinate.diameter - previousCoordinate.diameter);
                }
            }

            if (targetLength < coordinatesToUse[0].length) {
                return coordinatesToUse[0].diameter;
            }
            
            if (targetLength > coordinatesToUse[coordinatesToUse.length - 1].length) {
                return coordinatesToUse[coordinatesToUse.length - 1].diameter;
            }

            return Math.max(...coordinatesToUse.map(coordinate => coordinate.diameter));
        }

        function getMinimumDiameterAtLengthForCuttingType(targetLength, useRoughCuttingPath = false) {
            const coordinatesToUse = useRoughCuttingPath ? getAdjustedCoordinatesForRoughCutting() : coordinatesList;
            
            if (coordinatesToUse.length < 2) return 0;

            for (let segmentIndex = 1; segmentIndex < coordinatesToUse.length; segmentIndex++) {
                const previousCoordinate = coordinatesToUse[segmentIndex - 1];
                const currentCoordinate = coordinatesToUse[segmentIndex];
                
                const minimumLength = Math.min(previousCoordinate.length, currentCoordinate.length);
                const maximumLength = Math.max(previousCoordinate.length, currentCoordinate.length);
                
                if (targetLength >= minimumLength && targetLength <= maximumLength) {
                    const lengthRatio = (targetLength - previousCoordinate.length) / (currentCoordinate.length - previousCoordinate.length);
                    return previousCoordinate.diameter + lengthRatio * (currentCoordinate.diameter - previousCoordinate.diameter);
                }
            }

            if (targetLength < coordinatesToUse[0].length) {
                return coordinatesToUse[0].diameter;
            }
            
            if (targetLength > coordinatesToUse[coordinatesToUse.length - 1].length) {
                return coordinatesToUse[coordinatesToUse.length - 1].diameter;
            }

            return Math.min(...coordinatesToUse.map(coordinate => coordinate.diameter));
        }

        function calculateCuttableLengthForDiameter(cuttingDiameter, maximumLength, useRoughCuttingPath = false) {
            let cuttableLength = 0;
            
            for (let currentLength = 0; currentLength <= maximumLength; currentLength += 0.1) {
                const minimumDiameterAtPosition = getMinimumDiameterAtLengthForCuttingType(currentLength, useRoughCuttingPath);
                
                if (cuttingDiameter >= minimumDiameterAtPosition) {
                    cuttableLength = currentLength;
                } else {
                    break;
                }
            }
            
            return cuttableLength;
        }

        function addCoordinate() {
            const diameterInput = document.getElementById('coordinateDiameter').value;
            const lengthInput = document.getElementById('coordinateLength').value;
            const outerDiameterValue = parseFloat(document.getElementById('outerDiameter').value);
            const innerDiameterValue = parseFloat(document.getElementById('innerDiameter').value) || 0;
            const maximumLengthValue = parseFloat(document.getElementById('length').value);
            const isInternalCutting = innerDiameterValue > 0;
            const resultElement = document.getElementById('result');

            let diameterValue, lengthValue;
            let diameterWasIncremental = false;
            let lengthWasIncremental = false;
            
            if (diameterInput.startsWith('+') && coordinatesList.length > 0) {
                const incrementValue = parseFloat(diameterInput.substring(1));
                if (isNaN(incrementValue)) {
                    resultElement.textContent = 'Ogiltigt diameterinkrement';
                    resultElement.className = 'result error';
                    return;
                }
                diameterValue = coordinatesList[coordinatesList.length - 1].diameter + incrementValue;
                diameterWasIncremental = true;
            } else {
                diameterValue = parseFloat(diameterInput);
            }
            
            if (lengthInput.startsWith('+') && coordinatesList.length > 0) {
                const incrementValue = parseFloat(lengthInput.substring(1));
                if (isNaN(incrementValue)) {
                    resultElement.textContent = 'Ogiltigt längdinkrement';
                    resultElement.className = 'result error';
                    return;
                }
                lengthValue = coordinatesList[coordinatesList.length - 1].length + incrementValue;
                lengthWasIncremental = true;
            } else {
                lengthValue = parseFloat(lengthInput);
            }

            if (isNaN(diameterValue) || isNaN(lengthValue) || isNaN(outerDiameterValue) || isNaN(maximumLengthValue)) {
                resultElement.textContent = 'Ogiltiga koordinatvärden';
                resultElement.className = 'result error';
                return;
            }

            if (diameterValue > outerDiameterValue) {
                resultElement.textContent = 'Diameter får inte vara större än ytterdiameter';
                resultElement.className = 'result error';
                return;
            }

            if (diameterValue < innerDiameterValue) {
                resultElement.textContent = 'Diameter får inte vara mindre än innerdiameter';
                resultElement.className = 'result error';
                return;
            }

            if (lengthValue > maximumLengthValue) {
                resultElement.textContent = 'Längd får inte vara större än maxlängd';
                resultElement.className = 'result error';
                return;
            }

            if (coordinatesList.length > 0) {
                const lastCoordinate = coordinatesList[coordinatesList.length - 1];
                
                if (lengthValue < lastCoordinate.length) {
                    resultElement.textContent = `Längd måste vara större eller lika med föregående koordinat (senaste: ${lastCoordinate.length})`;
                    resultElement.className = 'result error';
                    return;
                }
                
                if (isInternalCutting) {
                    if (diameterValue > lastCoordinate.diameter) {
                        resultElement.textContent = `Vid innerbearbetning måste diameter vara mindre eller lika med föregående (senaste: ${lastCoordinate.diameter})`;
                        resultElement.className = 'result error';
                        return;
                    }
                } else {
                    if (diameterValue < lastCoordinate.diameter) {
                        resultElement.textContent = `Vid ytterbearbetning måste diameter vara större eller lika med föregående (senaste: ${lastCoordinate.diameter})`;
                        resultElement.className = 'result error';
                        return;
                    }
                }

                const diameterMatches = Math.abs(diameterValue - lastCoordinate.diameter) < 0.01;
                const lengthMatches = Math.abs(lengthValue - lastCoordinate.length) < 0.01;
                
                if (!diameterMatches && !lengthMatches) {
                    resultElement.textContent = `Minst en koordinat måste vara samma som föregående (diameter: ${lastCoordinate.diameter}, längd: ${lastCoordinate.length})`;
                    resultElement.className = 'result error';
                    return;
                }
            }

            const coordinateDiameterInput = document.getElementById('coordinateDiameter');
            const coordinateLengthInput = document.getElementById('coordinateLength');

            coordinatesList.push({ diameter: diameterValue, length: lengthValue });
            
            if (diameterWasIncremental) {
                coordinateDiameterInput.value = diameterValue.toString();
            }
            
            if (lengthWasIncremental) {
                coordinateLengthInput.value = lengthValue.toString();
            }

            resultElement.textContent = 'Ange värden och klicka Beräkna';
            resultElement.className = 'result';
            
            drawPreviewBackground();

            if (coordinatesList.length >= 2) {
                const secondLastCoordinate = coordinatesList[coordinatesList.length - 2];
                const lastCoordinate = coordinatesList[coordinatesList.length - 1];
                
                const diameterChanged = Math.abs(lastCoordinate.diameter - secondLastCoordinate.diameter) >= 0.01;
                const lengthChanged = Math.abs(lastCoordinate.length - secondLastCoordinate.length) >= 0.01;
                
                if (diameterChanged && !lengthChanged) {
                    coordinateLengthInput.focus();
                    coordinateLengthInput.select();
                } else if (lengthChanged && !diameterChanged) {
                    coordinateDiameterInput.focus();
                    coordinateDiameterInput.select();
                } else {
                    coordinateDiameterInput.focus();
                    coordinateDiameterInput.select();
                }
            } else {
                coordinateLengthInput.focus();
                coordinateLengthInput.select();
            }
        }

        function undoLastCoordinate() {
            const resultElement = document.getElementById('result');
            
            if (coordinatesList.length === 0) {
                return;
            }
            
            coordinatesList.pop();
            
            resultElement.textContent = 'Ange värden och klicka Beräkna';
            resultElement.className = 'result';
            
            drawPreviewBackground();
            
            const coordinateDiameterInput = document.getElementById('coordinateDiameter');
            const coordinateLengthInput = document.getElementById('coordinateLength');
            
            if (coordinatesList.length >= 2) {
                const secondLastCoordinate = coordinatesList[coordinatesList.length - 2];
                const lastCoordinate = coordinatesList[coordinatesList.length - 1];
                
                const diameterChanged = Math.abs(lastCoordinate.diameter - secondLastCoordinate.diameter) >= 0.01;
                const lengthChanged = Math.abs(lastCoordinate.length - secondLastCoordinate.length) >= 0.01;
                
                if (diameterChanged && !lengthChanged) {
                    coordinateLengthInput.focus();
                    coordinateLengthInput.select();
                } else if (lengthChanged && !diameterChanged) {
                    coordinateDiameterInput.focus();
                    coordinateDiameterInput.select();
                } else {
                    coordinateDiameterInput.focus();
                    coordinateDiameterInput.select();
                }
            } else {
                coordinateDiameterInput.focus();
                coordinateDiameterInput.select();
            }
        }

        function calculateTurningTime() {
            if (coordinatesList.length < 2) {
                return { error: 'Minst två koordinater med olika längdvärden krävs för beräkning' };
            }

            const roughCuttingEnabled = document.getElementById('enableRoughCutting').checked;
            const fineCuttingEnabled = document.getElementById('enableFineCutting').checked;

            if (!roughCuttingEnabled && !fineCuttingEnabled) {
                return { error: 'Minst en typ av bearbetning måste vara aktiverad' };
            }

            const feedRateValue = parseFloat(document.getElementById('feedRate').value);
            const cutDepthValue = parseFloat(document.getElementById('cutDepth').value);
            const cuttingSpeedValue = parseFloat(document.getElementById('cuttingSpeed').value);
            const fineFeedRateValue = parseFloat(document.getElementById('fineFeedRate').value);
            const fineCutDepthValue = parseFloat(document.getElementById('fineCutDepth').value);
            const fineCuttingSpeedValue = parseFloat(document.getElementById('fineCuttingSpeed').value);

                return { error: 'Ogiltiga skärdata för grovbearbetning' };

            if (fineCuttingEnabled && (isNaN(fineFeedRateValue) || isNaN(fineCutDepthValue) || isNaN(fineCuttingSpeedValue))) {
                return { error: 'Ogiltiga skärdata för finbearbetning' };
            }

            if (isNaN(maximumRotationsPerMinuteValue)) {
                return { error: 'Ogiltig varvtalsbegränsning' };
            }

            const hasLengthVariation = coordinatesList.some((coordinate, index) => 
                index > 0 && coordinate.length !== coordinatesList[0].length
            );

            if (!hasLengthVariation) {
                return { error: 'Koordinater måste ha olika längdvärden' };
            }

            const outerDiameterValue = parseFloat(document.getElementById('outerDiameter').value);
            const innerDiameterValue = parseFloat(document.getElementById('innerDiameter').value) || 0;
            const lengthValue = parseFloat(document.getElementById('length').value);
            const adjustedCoordinates = getAdjustedCoordinatesForRoughCutting();
            const isInternalCutting = innerDiameterValue > 0;
            
            let minimumRoughDiameter, maximumRoughDiameter, uniqueRoughPathDiameters;
            
            if (isInternalCutting) {
                minimumRoughDiameter = Math.min(...adjustedCoordinates.map(coordinate => coordinate.diameter));
                maximumRoughDiameter = Math.max(...adjustedCoordinates.map(coordinate => coordinate.diameter));
            } else {
                minimumRoughDiameter = Math.min(...adjustedCoordinates.map(coordinate => coordinate.diameter));
            }
            
            const minimumFineDiameter = Math.min(...coordinatesList.map(coordinate => coordinate.diameter));
            const maximumFineDiameter = Math.max(...coordinatesList.map(coordinate => coordinate.diameter));
            uniqueRoughPathDiameters = [...new Set(adjustedCoordinates.map(coordinate => coordinate.diameter))].sort((a, b) => b - a);
            
            let totalMachiningTime = 0;
            const cuttingPassDetails = [];

            if (roughCuttingEnabled) {
                let currentCutDiameter;
                
                if (isInternalCutting) {
                    currentCutDiameter = innerDiameterValue + (cutDepthValue * 2);
                    
                    while (currentCutDiameter <= maximumRoughDiameter) {
                        const calculatedRotationsPerMinute = (cuttingSpeedValue / currentCutDiameter) * 318;
                        const revolutionsPerMinute = Math.min(calculatedRotationsPerMinute, maximumRotationsPerMinuteValue);
                        const cuttableLength = calculateCuttableLengthForDiameterInternal(currentCutDiameter, lengthValue, true);
                        
                        const revolutionsRequired = cuttableLength / feedRateValue;
                        const passTime = revolutionsRequired / revolutionsPerMinute;

                        cuttingPassDetails.push({
                            diameter: currentCutDiameter,
                            rpm: revolutionsPerMinute,
                            length: cuttableLength,
                            time: passTime,
                            operation: 'cutting',
                            cuttingType: 'rough'
                        });

                        const nextCutDepth = Math.min(cutDepthValue * 2, remainingMaterial);

                        if (nextCutDiameter > maximumRoughDiameter) {
                            nextCutDiameter = maximumRoughDiameter;
                        }

                            pathDiameter > currentCutDiameter - nextCutDepth && pathDiameter < currentCutDiameter
                        );

                                Math.abs(coordinate.diameter - pathDiameter) < 0.1

                                        diameter: pathDiameter,
                                        rpm: pathRevolutionsPerMinute,

                                        time: pathCuttingTime,
                                        operation: 'cutting',
                                        cuttingType: 'rough'
                                    });

                                }
                            }
                        }

                            nextCutDiameter = minimumRoughDiameter;

                            pathDiameter < currentCutDiameter + nextCutDepth && pathDiameter > currentCutDiameter
                        );

                                Math.abs(coordinate.diameter - pathDiameter) < 0.1
                            );

                            if (coordinatesAtPathDiameter.length >= 2) {

                                if (pathCuttingLength > 0) {
                                    const calculatedPathRotationsPerMinute = (cuttingSpeedValue / pathDiameter) * 318;
                                    const pathRevolutionsPerMinute = Math.min(calculatedPathRotationsPerMinute, maximumRotationsPerMinuteValue);
                                    const pathRevolutionsRequired = pathCuttingLength / feedRateValue;
                                    const pathCuttingTime = pathRevolutionsRequired / pathRevolutionsPerMinute;

                                    cuttingPassDetails.push({
                                        diameter: pathDiameter,
                                        rpm: pathRevolutionsPerMinute,
                                        length: pathCuttingLength,

                        const medianDiameter = (startDiameter + endDiameter) / 2;
                        const traversalDistance = Math.abs(endDiameter - startDiameter) / 2;

        function calculateCuttableLengthForDiameterInternal(cuttingDiameter, maximumLength, useRoughCuttingPath = false) {
            let cuttableLength = 0;
            
            for (let currentLength = 0; currentLength <= maximumLength; currentLength += 0.1) {
                const minimumDiameterAtPosition = getMinimumDiameterAtLengthForCuttingType(currentLength, useRoughCuttingPath);
                
                if (cuttingDiameter <= minimumDiameterAtPosition) {
                    cuttableLength = currentLength;
                } else {
                    break;
                }
            }
            
            return cuttableLength;
        }

        function calculateTraversalTime(traversalDistance, feedRateValue, revolutionsPerMinute) {
            const traversalFeedRate = feedRateValue * 3;
            const revolutionsRequired = traversalDistance / traversalFeedRate;
            return revolutionsRequired / revolutionsPerMinute;
        }

            const isInternalCutting = innerDiameterValue > 0;
            const resultElement = document.getElementById('result');

            let diameterValue, lengthValue;
            let diameterWasIncremental = false;
            let lengthWasIncremental = false;
            
            if (diameterInput.startsWith('+') && coordinatesList.length > 0) {
                const incrementValue = parseFloat(diameterInput.substring(1));
                if (isNaN(incrementValue)) {
                    resultElement.textContent = 'Ogiltigt diameterinkrement';
                    resultElement.className = 'result error';
                    return;
                }
                diameterValue = coordinatesList[coordinatesList.length - 1].diameter + incrementValue;
                diameterWasIncremental = true;
            } else {
                diameterValue = parseFloat(diameterInput);
            }
            
            if (lengthInput.startsWith('+') && coordinatesList.length > 0) {
                const incrementValue = parseFloat(lengthInput.substring(1));
                if (isNaN(incrementValue)) {
                    resultElement.textContent = 'Ogiltigt längdinkrement';
                    resultElement.className = 'result error';
                    return;
                }
                lengthValue = coordinatesList[coordinatesList.length - 1].length + incrementValue;
                lengthWasIncremental = true;
            } else {
                lengthValue = parseFloat(lengthInput);
            }

            if (isNaN(diameterValue) || isNaN(lengthValue) || isNaN(outerDiameterValue) || isNaN(maximumLengthValue)) {
                resultElement.textContent = 'Ogiltiga koordinatvärden';
                resultElement.className = 'result error';
                return;
            }

            if (diameterValue > outerDiameterValue) {
                resultElement.textContent = 'Diameter får inte vara större än ytterdiameter';
                resultElement.className = 'result error';
                return;
            }

            if (diameterValue < innerDiameterValue) {
                resultElement.textContent = 'Diameter får inte vara mindre än innerdiameter';
                resultElement.className = 'result error';
                return;
            }

            if (lengthValue > maximumLengthValue) {
                resultElement.textContent = 'Längd får inte vara större än maxlängd';
                resultElement.className = 'result error';
                return;
            }

            if (coordinatesList.length > 0) {
                const lastCoordinate = coordinatesList[coordinatesList.length - 1];
                
                if (lengthValue < lastCoordinate.length) {
                    resultElement.textContent = `Längd måste vara större eller lika med föregående koordinat (senaste: ${lastCoordinate.length})`;
                    resultElement.className = 'result error';
                    return;
                }
                
                if (isInternalCutting) {
                    if (diameterValue > lastCoordinate.diameter) {
                        resultElement.textContent = `Vid innerbearbetning måste diameter vara mindre eller lika med föregående (senaste: ${lastCoordinate.diameter})`;
                        resultElement.className = 'result error';
                        return;
                    }
                } else {
                    if (diameterValue < lastCoordinate.diameter) {
                        resultElement.textContent = `Vid ytterbearbetning måste diameter vara större eller lika med föregående (senaste: ${lastCoordinate.diameter})`;
                        resultElement.className = 'result error';
                        return;
                    }
                }

                const diameterMatches = Math.abs(diameterValue - lastCoordinate.diameter) < 0.01;
                const lengthMatches = Math.abs(lengthValue - lastCoordinate.length) < 0.01;
                
                if (!diameterMatches && !lengthMatches) {
                    resultElement.textContent = `Minst en koordinat måste vara samma som föregående (diameter: ${lastCoordinate.diameter}, längd: ${lastCoordinate.length})`;
                    resultElement.className = 'result error';
                    return;

            const coordinateLengthInput = document.getElementById('coordinateLength');

                coordinateDiameterInput.value = diameterValue.toString();
            }

                coordinateLengthInput.value = lengthValue.toString();
            }

            resultElement.textContent = 'Ange värden och klicka Beräkna';
            resultElement.className = 'result';
            
            drawPreviewBackground();

            if (coordinatesList.length >= 2) {
                const secondLastCoordinate = coordinatesList[coordinatesList.length - 2];
                const lastCoordinate = coordinatesList[coordinatesList.length - 1];
                
                const diameterChanged = Math.abs(lastCoordinate.diameter - secondLastCoordinate.diameter) >= 0.01;
                const lengthChanged = Math.abs(lastCoordinate.length - secondLastCoordinate.length) >= 0.01;
                
                if (diameterChanged && !lengthChanged) {
                    coordinateLengthInput.focus();
                    coordinateLengthInput.select();
                } else if (lengthChanged && !diameterChanged) {
                    coordinateDiameterInput.focus();
                    coordinateDiameterInput.select();
                } else {
                    coordinateDiameterInput.focus();
                    coordinateDiameterInput.select();
                }
            } else {
                coordinateLengthInput.focus();
                coordinateLengthInput.select();
            }
        }

                            rpm: revolutionsPerMinute,
                            length: traversalDistance,
                            time: traversalTime,
                            operation: 'cutting',
                            cuttingType: 'fine'
                        });
                        
                        totalMachiningTime += traversalTime;
                    } else if (startLength !== endLength) {
                        const segmentLength = Math.abs(endLength - startLength);
                        const medianDiameter = (startDiameter + endDiameter) / 2;
                        const calculatedRotationsPerMinute = (fineCuttingSpeedValue / medianDiameter) * 318;
                        const revolutionsPerMinute = Math.min(calculatedRotationsPerMinute, maximumRotationsPerMinuteValue);
                        const revolutionsRequired = segmentLength / fineFeedRateValue;
                        const segmentTime = revolutionsRequired / revolutionsPerMinute;
                        
                        cuttingPassDetails.push({
                            diameter: medianDiameter,
                            rpm: revolutionsPerMinute,
                            length: segmentLength,
                            time: segmentTime,
                            operation: 'cutting',
                            cuttingType: 'fine'
                        });
                        
                        totalMachiningTime += segmentTime;
                    }
                }
            }

            return { 
                time: totalMachiningTime,
                cuttingPasses: cuttingPassDetails
            };
        }

        function performTurningTimeCalculation() {
            const outerDiameterValue = parseFloat(document.getElementById('outerDiameter').value);
            const innerDiameterValue = parseFloat(document.getElementById('innerDiameter').value) || 0;
            const lengthValue = parseFloat(document.getElementById('length').value);
            const maximumRotationsPerMinuteValue = parseFloat(document.getElementById('maximumRotationsPerMinute').value);
            const fineCuttingEnabled = document.getElementById('enableFineCutting').checked;
            const resultElement = document.getElementById('result');
            const isInternalCutting = innerDiameterValue > 0;
            
            if (isNaN(outerDiameterValue) || isNaN(lengthValue) || isNaN(maximumRotationsPerMinuteValue)) {
                resultElement.textContent = 'Vänligen ange giltiga värden för obligatoriska fält';
                resultElement.className = 'result error';
                return;
            }

            if (coordinatesList.length > 0) {
                const lastCoordinate = coordinatesList[coordinatesList.length - 1];
                
                if (isInternalCutting) {
                    if (lastCoordinate.length < lengthValue && lastCoordinate.diameter > innerDiameterValue) {
                        coordinatesList.push({
                            diameter: innerDiameterValue,
                            length: lastCoordinate.length
                        });
                        drawPreviewBackground();
                    }
                } else {
                    if (lastCoordinate.length < lengthValue && lastCoordinate.diameter < outerDiameterValue) {
                        coordinatesList.push({
                            diameter: outerDiameterValue,
                            length: lastCoordinate.length
                        });
                        drawPreviewBackground();
                    }
                }
            }

            const turningTimeResult = calculateTurningTime();

            if (turningTimeResult.error) {
                resultElement.textContent = turningTimeResult.error;
                resultElement.className = 'result error';
                return;
            }

            const reorderedCuttingPasses = [];
            let passIndex = 0;

            while (passIndex < turningTimeResult.cuttingPasses.length) {
                const currentPass = turningTimeResult.cuttingPasses[passIndex];
                
                if (currentPass.operation === 'traversal' && passIndex + 2 < turningTimeResult.cuttingPasses.length) {
                    const firstPassAfterTraversal = turningTimeResult.cuttingPasses[passIndex + 1];
                    const secondPassAfterTraversal = turningTimeResult.cuttingPasses[passIndex + 2];
                    
                    reorderedCuttingPasses.push(currentPass);
                    reorderedCuttingPasses.push(secondPassAfterTraversal);
                    reorderedCuttingPasses.push(firstPassAfterTraversal);
                    
                    passIndex += 3;
                } else {
                    reorderedCuttingPasses.push(currentPass);
                    passIndex++;
                }
            }

            let roughCutTimeTotal = 0;
            let fineCutTimeTotal = 0;

            let tableHtml = `
                <table class="turning-time__results-table">
                    <thead>
                        <tr>
                            <th class="column-length">Längd</th>
                            <th class="column-diameter">Diameter</th>
                            <th class="column-rotations-per-minute">RPM</th>
                            <th class="column-seconds">Sekunder</th>
                            <th class="column-minutes">Minuter</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            reorderedCuttingPasses.forEach((cuttingPass) => {
                const passTimeInSeconds = cuttingPass.time * 60;
                
                if (cuttingPass.operation === 'cutting') {
                    const cutTypeClass = cuttingPass.cuttingType === 'rough' ? 'time-rough-cut' : 'time-fine-cut';
                    const passTimeInMinutes = Math.round(passTimeInSeconds / 60 * 2) / 2;
                    
                    if (cuttingPass.cuttingType === 'rough') {
                        roughCutTimeTotal += passTimeInSeconds;
                    } else {
                        fineCutTimeTotal += passTimeInSeconds;
                    }
                    
                    tableHtml += `
                        <tr>
                            <td class="column-length">${cuttingPass.length.toFixed(1)}</td>
                            <td class="column-diameter">${cuttingPass.diameter.toFixed(1)}</td>
                            <td class="column-rotations-per-minute">${cuttingPass.rpm.toFixed(0)}</td>
                            <td class="column-seconds ${cutTypeClass}">${Math.round(passTimeInSeconds)}</td>
                            <td class="column-minutes ${cutTypeClass}">${passTimeInMinutes.toFixed(1)}</td>
                        </tr>
                    `;
                } 
            });

            tableHtml += `
                    </tbody>
                </table>
            `;

            const totalTimeInSeconds = roughCutTimeTotal + fineCutTimeTotal;

            function formatTimeWithMinutes(timeInSeconds) {
                const roundedSeconds = Math.round(timeInSeconds);
                const minutes = Math.round(timeInSeconds / 60 * 2) / 2;
                return `${roundedSeconds} s (${minutes.toFixed(1)} min)`;
            }

            let summaryHtml = '<div class="turning-time__results-summary">';
            
            if (fineCuttingEnabled) {
                summaryHtml += `
                    <div class="summary-item summary-rough">
                        <span class="summary-label">Grovbearbetning</span>
                        <span class="summary-value">${formatTimeWithMinutes(roughCutTimeTotal)}</span>
                    </div>
                    <div class="summary-item summary-fine">
                        <span class="summary-label">Finbearbetning</span>
                        <span class="summary-value">${formatTimeWithMinutes(fineCutTimeTotal)}</span>
                    </div>
                `;
            }
            
            summaryHtml += `
                <div class="summary-item summary-total">
                    <span class="summary-label">Total</span>
                    <span class="summary-value">${formatTimeWithMinutes(totalTimeInSeconds)}</span>
                </div>
            </div>`;

            resultElement.innerHTML = tableHtml + summaryHtml;
            resultElement.className = 'result';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const outerDiameterInput = document.getElementById('outerDiameter');
            const lengthInput = document.getElementById('length');
            const innerDiameterInput = document.getElementById('innerDiameter');
            const enableRoughCuttingSwitch = document.getElementById('enableRoughCutting');
            const enableFineCuttingSwitch = document.getElementById('enableFineCutting');
            const coordinateDiameterInput = document.getElementById('coordinateDiameter');
            const coordinateLengthInput = document.getElementById('coordinateLength');
            
            outerDiameterInput.addEventListener('input', updateCoordinateLengthState);
            lengthInput.addEventListener('input', updateCoordinateLengthState);
            innerDiameterInput.addEventListener('input', handleInnerDiameterChange);
            enableRoughCuttingSwitch.addEventListener('change', updateRoughCuttingInputVisibility);
            enableFineCuttingSwitch.addEventListener('change', updateFineCuttingInputVisibility);
            
            coordinateDiameterInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    addCoordinate();
                }
            });
            
            coordinateLengthInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    addCoordinate();
                }
            });
            
            innerDiameterInput.dataset.previousValue = '0';
            
            updateCoordinateLengthState();
            updateRoughCuttingInputVisibility();
            updateFineCuttingInputVisibility();
            
            coordinateDiameterInput.focus();
        });

        document.addEventListener('keydown', function(event) {
            const activeElement = document.activeElement;
            const isCoordinateInput = activeElement && (
                activeElement.id === 'coordinateDiameter' || 
                activeElement.id === 'coordinateLength'
            );
            
            if (event.key === 'Enter' && !isCoordinateInput) {
                event.preventDefault();
                performTurningTimeCalculation();
            } else if (event.key === 'Escape') {
                event.preventDefault();
                clearTurningCalculatorInputs();
            } else if (event.ctrlKey && event.key === 'z') {
                event.preventDefault();
                undoLastCoordinate();
            }
        });
    </script>
</body>
</html>
