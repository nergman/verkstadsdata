<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fräshastighets- kalkylatorn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navigation">
        <a href="../">← Tillbaka till huvudsidan</a>
    </div>

    <h1>Fräshastighets- kalkylatorn</h1>

    <div class="milling-calculator">
        <div class="milling-calculator__inputs">
            <div class="input-group tool-select-group">
                <div class="tool-select-labels">
                    <label for="toolSelect">Verktyg</label>
                    <label for="maxRpm">Max RPM</label>
                </div>
                <div class="tool-select-row">
                    <div class="tool-select-with-clear">
                        <select id="toolSelect" onchange="handleToolSelection()">
                            <option value="">Välj verktyg...</option>
                            <option value="save">Spara verktyg...</option>
                        </select>
                    </div>
                    <div class="max-rpm-with-clear">
                        <input type="number" id="maxRpm" step="1" min="1" value="1400" placeholder="Max varvtal" oninput="handleMaxRpmChange()">
                        <button class="clear-button" onclick="clearInputs()" title="Rensa">×</button>
                    </div>
                </div>
            </div>

            <div class="input-group tool-diameter-group">
                <label for="toolDiameter">Diameter</label>
                <input type="number" id="toolDiameter" step="any" placeholder="Ange verktygsdiameter" oninput="calculateInRealTime()">
            </div>

            <div class="input-group number-of-teeth-group">
                <label for="numberOfTeeth">Antal skär</label>
                <input type="number" id="numberOfTeeth" step="1" min="1" placeholder="Ange antal skär" oninput="calculateInRealTime()">
            </div>

            <div class="input-group speed-group">
                <div class="input-header">
                    <label>Spindel</label>
                </div>
                <div class="input-content">
                    <div class="toggle-switch">
                        <input type="radio" id="speedModeCutting" name="speedMode" value="cutting" checked onchange="handleSpeedModeChange()">
                        <label for="speedModeCutting">m/min</label>
                        <input type="radio" id="speedModeRpm" name="speedMode" value="rpm" onchange="handleSpeedModeChange()">
                        <label for="speedModeRpm">RPM</label>
                    </div>
                    <div class="input-with-result">
                        <input type="number" id="speedInput" step="any" placeholder="Ange skärhastighet" oninput="calculateInRealTime()">
                        <div id="speedResult" class="result-display"></div>
                    </div>
                </div>
            </div>

            <div class="input-group feed-group">
                <div class="input-header">
                    <label>Matning</label>
                </div>
                <div class="input-content">
                    <div class="toggle-switch">
                        <input type="radio" id="feedModePerTooth" name="feedMode" value="perTooth" checked onchange="handleFeedModeChange()">
                        <label for="feedModePerTooth">mm/skär</label>
                        <input type="radio" id="feedModePerMinute" name="feedMode" value="perMinute" onchange="handleFeedModeChange()">
                        <label for="feedModePerMinute">mm/min</label>
                    </div>
                    <div class="input-with-result">
                        <input type="number" id="feedInput" step="any" placeholder="Ange matning per skär" oninput="calculateInRealTime()">
                        <div id="feedResult" class="result-display"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="milling-calculator__material-guide">
            <h3>Materialguide (Skärhastighet m/min)</h3>
            <div class="material-grid">
                <div class="material-item">
                    <strong>Mjukt stål</strong>
                    <span>200-300</span>
                </div>
                <div class="material-item">
                    <strong>Hårt stål</strong>
                    <span>100-200</span>
                </div>
                <div class="material-item">
                    <strong>Rostfritt stål</strong>
                    <span>80-150</span>
                </div>
                <div class="material-item">
                    <strong>Aluminium</strong>
                    <span>400-800</span>
                </div>
                <div class="material-item">
                    <strong>Mässing</strong>
                    <span>200-400</span>
                </div>
                <div class="material-item">
                    <strong>Gjutjärn</strong>
                    <span>150-250</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleToolSelection() {
            const toolSelectElement = document.getElementById('toolSelect');
            const selectedValue = toolSelectElement.value;
            
            if (selectedValue === 'save') {
                saveCurrentTool();
                toolSelectElement.value = '';
            } else if (selectedValue && selectedValue !== 'save') {
                loadSavedTool(selectedValue);
            }
        }

        function saveCurrentTool() {
            const toolDiameterValue = document.getElementById('toolDiameter').value;
            const numberOfTeethValue = document.getElementById('numberOfTeeth').value;

            if (!toolDiameterValue || !numberOfTeethValue) {
                alert('Fyll i verktygsdiameter och antal skär innan du sparar verktyget');
                return;
            }

            const toolName = prompt('Ange namn för verktyget:');
            if (!toolName) return;

            const toolData = {
                diameter: toolDiameterValue,
                teeth: numberOfTeethValue
            };

            localStorage.setItem(`millingTool_${toolName}`, JSON.stringify(toolData));
            updateToolSelectOptions();
        }

        function loadSavedTool(toolName) {
            const toolData = JSON.parse(localStorage.getItem(`millingTool_${toolName}`));
            if (toolData) {
                document.getElementById('toolDiameter').value = toolData.diameter || '';
                document.getElementById('numberOfTeeth').value = toolData.teeth || '';
                
                document.getElementById('speedInput').value = '';
                document.getElementById('feedInput').value = '';
                document.getElementById('speedResult').textContent = '';
                document.getElementById('feedResult').textContent = '';
                
                document.getElementById('speedModeCutting').checked = true;
                document.getElementById('feedModePerTooth').checked = true;
                handleSpeedModeChange();
                handleFeedModeChange();
                
                calculateInRealTime();
            }
        }

        function updateToolSelectOptions() {
            const toolSelectElement = document.getElementById('toolSelect');
            const currentValue = toolSelectElement.value;
            
            toolSelectElement.innerHTML = '<option value="">Välj verktyg...</option>';
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('millingTool_')) {
                    const toolName = key.replace('millingTool_', '');
                    const option = document.createElement('option');
                    option.value = toolName;
                    option.textContent = toolName;
                    toolSelectElement.appendChild(option);
                }
            }
            
            const saveOption = document.createElement('option');
            saveOption.value = 'save';
            saveOption.textContent = 'Spara verktyg...';
            toolSelectElement.appendChild(saveOption);
            
            toolSelectElement.value = currentValue;
        }

        function handleSpeedModeChange() {
            const speedMode = document.querySelector('input[name="speedMode"]:checked').value;
            const speedInput = document.getElementById('speedInput');
            const currentValue = parseFloat(speedInput.value);
            const toolDiameterValue = parseFloat(document.getElementById('toolDiameter').value);
            
            if (!isNaN(currentValue) && currentValue > 0 && !isNaN(toolDiameterValue) && toolDiameterValue > 0) {
                if (speedMode === 'cutting') {
                    const convertedCuttingSpeed = (currentValue * Math.PI * toolDiameterValue) / 1000;
                    speedInput.value = Math.round(convertedCuttingSpeed * 10) / 10;
                    speedInput.placeholder = 'Ange skärhastighet';
                } else {
                    const convertedRotationsPerMinute = (currentValue * 1000) / (Math.PI * toolDiameterValue);
                    speedInput.value = Math.round(convertedRotationsPerMinute);
                    speedInput.placeholder = 'Ange varvtal';
                }
            } else {
                if (speedMode === 'cutting') {
                    speedInput.placeholder = 'Ange skärhastighet';
                } else {
                    speedInput.placeholder = 'Ange varvtal';
                }
            }
            
            calculateInRealTime();
        }

        function handleFeedModeChange() {
            const feedMode = document.querySelector('input[name="feedMode"]:checked').value;
            const feedInput = document.getElementById('feedInput');
            const currentValue = parseFloat(feedInput.value);
            const toolDiameterValue = parseFloat(document.getElementById('toolDiameter').value);
            const numberOfTeethValue = parseInt(document.getElementById('numberOfTeeth').value);
            const speedInputValue = parseFloat(document.getElementById('speedInput').value);
            const speedMode = document.querySelector('input[name="speedMode"]:checked').value;
            
            if (!isNaN(currentValue) && currentValue > 0 && 
                !isNaN(toolDiameterValue) && toolDiameterValue > 0 &&
                !isNaN(numberOfTeethValue) && numberOfTeethValue > 0 &&
                !isNaN(speedInputValue) && speedInputValue > 0) {
                
                let rotationsPerMinute;
                if (speedMode === 'cutting') {
                    rotationsPerMinute = (speedInputValue * 1000) / (Math.PI * toolDiameterValue);
                } else {
                    rotationsPerMinute = speedInputValue;
                }
                
                if (feedMode === 'perTooth') {
                    const convertedFeedPerTooth = currentValue / (rotationsPerMinute * numberOfTeethValue);
                    feedInput.value = Math.round(convertedFeedPerTooth * 1000) / 1000;
                    feedInput.placeholder = 'Ange matning per skär';
                } else {
                    const convertedFeedRatePerMinute = currentValue * rotationsPerMinute * numberOfTeethValue;
                    feedInput.value = Math.round(convertedFeedRatePerMinute);
                    feedInput.placeholder = 'Ange matning per minut';
                }
            } else {
                if (feedMode === 'perTooth') {
                    feedInput.placeholder = 'Ange matning per skär';
                } else {
                    feedInput.placeholder = 'Ange matning per minut';
                }
            }
            
            calculateInRealTime();
        }

        function calculateInRealTime() {
            const toolDiameterValue = parseFloat(document.getElementById('toolDiameter').value);
            const numberOfTeethValue = parseInt(document.getElementById('numberOfTeeth').value);
            const speedInputValue = parseFloat(document.getElementById('speedInput').value);
            const feedInputValue = parseFloat(document.getElementById('feedInput').value);
            const maxRpmValue = parseFloat(document.getElementById('maxRpm').value);
            const speedMode = document.querySelector('input[name="speedMode"]:checked').value;
            const feedMode = document.querySelector('input[name="feedMode"]:checked').value;
            
            const speedResult = document.getElementById('speedResult');
            const feedResult = document.getElementById('feedResult');
            
            speedResult.textContent = '';
            feedResult.textContent = '';
            
            if (isNaN(toolDiameterValue) || toolDiameterValue <= 0 || 
                isNaN(numberOfTeethValue) || numberOfTeethValue <= 0 ||
                isNaN(speedInputValue) || speedInputValue <= 0) {
                return;
            }
            
            let calculatedRotationsPerMinute;
            const effectiveMaxRpm = maxRpmValue || 1400;
            
            if (speedMode === 'cutting') {
                calculatedRotationsPerMinute = (speedInputValue * 1000) / (Math.PI * toolDiameterValue);
                const displayRpm = Math.round(calculatedRotationsPerMinute);
                
                if (calculatedRotationsPerMinute > effectiveMaxRpm) {
                    speedResult.textContent = `RPM ${effectiveMaxRpm} (${displayRpm})`;
                    speedResult.style.color = 'var(--warning-color, #ff6b35)';
                } else {
                    speedResult.textContent = `${displayRpm} RPM`;
                    speedResult.style.color = 'var(--primary-color)';
                }
            } else {
                const calculatedCuttingSpeed = (speedInputValue * Math.PI * toolDiameterValue) / 1000;
                speedResult.textContent = `${Math.round(calculatedCuttingSpeed * 10) / 10} m/min`;
                speedResult.style.color = 'var(--primary-color)';
                calculatedRotationsPerMinute = speedInputValue;
                
                if (speedInputValue > effectiveMaxRpm) {
                    speedResult.style.color = 'var(--warning-color, #ff6b35)';
                }
            }
            
            if (!isNaN(feedInputValue) && feedInputValue > 0) {
                const actualRotationsPerMinute = Math.min(calculatedRotationsPerMinute, effectiveMaxRpm);
                
                if (feedMode === 'perTooth') {
                    const calculatedFeedRatePerMinute = actualRotationsPerMinute * numberOfTeethValue * feedInputValue;
                    
                    if (calculatedRotationsPerMinute > effectiveMaxRpm) {
                        const theoreticalFeedRate = calculatedRotationsPerMinute * numberOfTeethValue * feedInputValue;
                        feedResult.textContent = `${Math.round(calculatedFeedRatePerMinute)} mm/min (${Math.round(theoreticalFeedRate)})`;
                        feedResult.style.color = 'var(--warning-color, #ff6b35)';
                    } else {
                        feedResult.textContent = `${Math.round(calculatedFeedRatePerMinute)} mm/min`;
                        feedResult.style.color = 'var(--primary-color)';
                    }
                } else {
                    const calculatedFeedPerTooth = feedInputValue / (actualRotationsPerMinute * numberOfTeethValue);
                    
                    if (calculatedRotationsPerMinute > effectiveMaxRpm) {
                        const theoreticalFeedPerTooth = feedInputValue / (calculatedRotationsPerMinute * numberOfTeethValue);
                        feedResult.textContent = `${Math.round(calculatedFeedPerTooth * 1000) / 1000} mm/skär (${Math.round(theoreticalFeedPerTooth * 1000) / 1000})`;
                        feedResult.style.color = 'var(--warning-color, #ff6b35)';
                    } else {
                        feedResult.textContent = `${Math.round(calculatedFeedPerTooth * 1000) / 1000} mm/skär`;
                        feedResult.style.color = 'var(--primary-color)';
                    }
                }
            }
        }

        function handleMaxRpmChange() {
            const maxRpmValue = document.getElementById('maxRpm').value;
            localStorage.setItem('millingCalculatorMaxRpm', maxRpmValue);
            calculateInRealTime();
        }

        function loadMaxRpmFromStorage() {
            const storedMaxRpm = localStorage.getItem('millingCalculatorMaxRpm');
            if (storedMaxRpm) {
                document.getElementById('maxRpm').value = storedMaxRpm;
            }
        }

        function clearInputs() {
            document.getElementById('toolSelect').value = '';
            
            const storedMaxRpm = localStorage.getItem('millingCalculatorMaxRpm') || '1400';
            document.getElementById('maxRpm').value = storedMaxRpm;
            
            document.getElementById('toolDiameter').value = '';
            document.getElementById('numberOfTeeth').value = '';
            document.getElementById('speedInput').value = '';
            document.getElementById('feedInput').value = '';
            document.getElementById('speedResult').textContent = '';
            document.getElementById('feedResult').textContent = '';
            
            document.getElementById('speedModeCutting').checked = true;
            document.getElementById('feedModePerTooth').checked = true;
            handleSpeedModeChange();
            handleFeedModeChange();
            
            document.getElementById('toolDiameter').focus();
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                event.preventDefault();
                clearInputs();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            loadMaxRpmFromStorage();
            updateToolSelectOptions();
            document.getElementById('toolDiameter').focus();
        });
    </script>
</body>
</html>
