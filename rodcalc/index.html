<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stångkalkylator</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="navigation">
        <a href="../">← Tillbaka till huvudsidan</a>
    </div>

    <h1>Stångkalkylator</h1>

    <div class="calculator">
        <div class="inputGroup">
            <label for="outerDiameter">Ytterdiameter</label>
            <input type="number" id="outerDiameter" step="any" placeholder="Ange ytterdiameter">
        </div>

        <div class="inputGroup">
            <label for="length">Längd</label>
            <input type="number" id="length" step="any" placeholder="Ange längd">
        </div>

        <div class="inputGroup">
            <label for="innerDiameter">Innerdiameter <span class="optional">(valfritt)</span></label>
            <input type="number" id="innerDiameter" step="any" placeholder="Ange innerdiameter (valfritt)">
        </div>

        <div class="inputGroup">
            <label for="quantity">Antal</label>
            <input type="number" id="quantity" step="1" placeholder="Ange antal" min="1">
        </div>

        <div class="inputGroup">
            <label for="tipWidth">Skärbredd</label>
            <input type="number" id="tipWidth" step="any" value="3" placeholder="Ange spetsbredd">
        </div>

        <div class="inputGroup">
            <label for="maxCutDepth">Max skärdjup</label>
            <input type="number" id="maxCutDepth" step="any" value="25" placeholder="Ange max skärdjup">
        </div>

        <div class="inputGroup">
            <label for="extraLength">Överlängd vid kuts</label>
            <input type="number" id="extraLength" step="any" value="15" placeholder="Ange överlängd vid kuts">
        </div>

        <div class="inputGroup">
            <label for="maxRodLength">Max stånglängd</label>
            <input type="number" id="maxRodLength" step="any" value="800" placeholder="Ange max stånglängd">
        </div>

        <div class="inputGroup">
            <div class="switch-container">
                <div class="switch-group">
                    <div class="switch-group-label">Ställbit</div>
                    <label class="switch">
                        <input type="checkbox" id="testPiece" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                
                <div class="switch-group">
                    <div class="switch-group-label">Samma längd</div>
                    <label class="switch">
                        <input type="checkbox" id="sameLength">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <button class="calculateButton" onclick="performRodCalculation()">Beräkna</button>
        
        <div class="result" id="result">Ange värden och klicka Beräkna</div>
        
        <div class="result" id="resultTwo" style="margin-top: 10px; display: none;">Resultat 2</div>
        
        <div class="result" id="resultThree" style="margin-top: 10px; display: none;">Resultat 3</div>
        
        <button class="clearButton" onclick="clearCalculatorInputs()">Rensa alla</button>
    </div>

    <script>
        function performRodCalculation() {
            const outerDiameterValue = parseFloat(document.getElementById('outerDiameter').value);
            const lengthValue = parseFloat(document.getElementById('length').value);
            const innerDiameterValue = parseFloat(document.getElementById('innerDiameter').value) || 0;
            const quantityValue = parseInt(document.getElementById('quantity').value);
            const tipWidthValue = parseFloat(document.getElementById('tipWidth').value);
            const maxCutDepthValue = parseFloat(document.getElementById('maxCutDepth').value);
            const extraLengthValue = parseFloat(document.getElementById('extraLength').value);
            const maxRodLengthValue = parseFloat(document.getElementById('maxRodLength').value);
            const hasTestPiece = document.getElementById('testPiece').checked;
            const requiresSameLength = document.getElementById('sameLength').checked;
            
            const resultElement = document.getElementById('result');
            const resultTwoElement = document.getElementById('resultTwo');
            const resultThreeElement = document.getElementById('resultThree');
            
            if (isNaN(outerDiameterValue) || isNaN(lengthValue) || isNaN(quantityValue) || isNaN(tipWidthValue) || isNaN(maxCutDepthValue) || isNaN(extraLengthValue) || isNaN(maxRodLengthValue) || quantityValue < 1) {
                resultElement.textContent = 'Vänligen ange giltiga värden för obligatoriska fält';
                resultElement.className = 'result error';
                resultTwoElement.style.display = 'none';
                resultThreeElement.style.display = 'none';
                return;
            }
            
            const wallThickness = (outerDiameterValue - innerDiameterValue) / 2;
            
            if (wallThickness > maxCutDepthValue) {
                resultElement.textContent = `Fel: Gods tjocklek (${wallThickness.toFixed(2)}) är för stor för max skärdjup (${maxCutDepthValue})`;
                resultElement.className = 'result error';
                resultTwoElement.style.display = 'none';
                resultThreeElement.style.display = 'none';
                return;
            }
            
            let rodLengths = [];
            
            if (requiresSameLength) {
                const minimumRodLength = lengthValue + extraLengthValue;
                const firstRodExtraLength = hasTestPiece ? lengthValue : extraLengthValue;
                
                let bestTotalLength = Infinity;
                let bestRodLengths = [];
                
                const maximumPiecesPerRod = Math.floor((maxRodLengthValue - firstRodExtraLength) / (lengthValue + tipWidthValue + 2));
                
                for (let piecesPerRod = 1; piecesPerRod <= maximumPiecesPerRod; piecesPerRod++) {
                    const rodLength = ((lengthValue + tipWidthValue + 2) * piecesPerRod) + firstRodExtraLength;
                    
                    if (rodLength >= minimumRodLength && rodLength <= maxRodLengthValue) {
                        const numberOfRods = Math.ceil(quantityValue / piecesPerRod);
                        const totalLength = numberOfRods * rodLength;
                        
                        if (totalLength < bestTotalLength) {
                            bestTotalLength = totalLength;
                            bestRodLengths = Array(numberOfRods).fill(rodLength);
                        }
                    }
                }
                
                if (bestRodLengths.length === 0) {
                    resultElement.textContent = 'Fel: Kan inte beräkna samma längd med givna parametrar';
                    resultElement.className = 'result error';
                    resultTwoElement.style.display = 'none';
                    resultThreeElement.style.display = 'none';
                    return;
                }
                
                rodLengths = bestRodLengths;
            } else {
                const firstRodExtraLength = hasTestPiece ? lengthValue : extraLengthValue;
                const firstRodLength = ((lengthValue + tipWidthValue + 2) * quantityValue) + firstRodExtraLength;
                let remainingQuantity = quantityValue;
                
                if (firstRodLength <= maxRodLengthValue) {
                    rodLengths.push(firstRodLength);
                } else {
                    const firstRodQuantity = Math.floor((maxRodLengthValue - firstRodExtraLength) / (lengthValue + tipWidthValue + 2));
                    rodLengths.push(((lengthValue + tipWidthValue + 2) * firstRodQuantity) + firstRodExtraLength);
                    remainingQuantity -= firstRodQuantity;
                    
                    while (remainingQuantity > 0) {
                        const subsequentRodQuantity = Math.floor((maxRodLengthValue - extraLengthValue) / (lengthValue + tipWidthValue + 2));
                        const actualQuantity = Math.min(subsequentRodQuantity, remainingQuantity);
                        rodLengths.push(((lengthValue + tipWidthValue + 2) * actualQuantity) + extraLengthValue);
                        remainingQuantity -= actualQuantity;
                    }
                }
            }
            
            const totalRodLength = rodLengths.reduce((sum, length) => sum + length, 0);
            const cutLength = lengthValue + extraLengthValue;
            const totalCutLength = cutLength * quantityValue;
            
            if (rodLengths.length === 1) {
                resultElement.textContent = `Stång: ${rodLengths[0].toFixed(2)} mm (1 stång)`;
            } else {
                const rodLengthsText = rodLengths.map(length => `${length.toFixed(2)} mm`).join(' + ');
                resultElement.textContent = `Stång: ${rodLengths.length} stänger: ${rodLengthsText} = ${totalRodLength.toFixed(2)} mm totalt`;
            }
            resultElement.className = 'result';
            
            resultTwoElement.textContent = `Kuts: ${cutLength.toFixed(2)} mm`;
            resultTwoElement.className = 'result';
            resultTwoElement.style.display = 'block';
            
            resultThreeElement.textContent = `Kuts * ${quantityValue}: ${totalCutLength.toFixed(2)} mm`;
            resultThreeElement.className = 'result';
            resultThreeElement.style.display = 'block';
        }

        function clearCalculatorInputs() {
            document.getElementById('outerDiameter').value = '';
            document.getElementById('length').value = '';
            document.getElementById('innerDiameter').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('tipWidth').value = '3';
            document.getElementById('maxCutDepth').value = '25';
            document.getElementById('extraLength').value = '15';
            document.getElementById('maxRodLength').value = '800';
            document.getElementById('testPiece').checked = true;
            document.getElementById('sameLength').checked = false;
            document.getElementById('result').textContent = 'Ange värden och klicka Beräkna';
            document.getElementById('result').className = 'result';
            document.getElementById('resultTwo').style.display = 'none';
            document.getElementById('resultThree').style.display = 'none';
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                performRodCalculation();
            } else if (event.key === 'Escape') {
                event.preventDefault();
                clearCalculatorInputs();
            }
        });
    </script>
</body>
</html>
